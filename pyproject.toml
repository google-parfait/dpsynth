[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dpsynth"
description = "Differentially Private Synthetic Tabular Data Generation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {file = "LICENSE"}
authors = [{name = "dpsynth authors", email="mckennar@google.com"}]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
]
keywords = []
dependencies = [
    "absl-py",
    "attrs",
    "cattrs",
    "etils[epath]",
    "fancyflags",
    "numpy",
    "pandas",
    "pydantic>=2.0",
    "pyyaml",
    "dp_accounting @ git+https://github.com/google/differential-privacy.git#subdirectory=python/dp_accounting",
    "jax[cpu]==0.11.0",
    "more-itertools",
    "networkx",
    "scipy",
    "tqdm",
    "mbi @ git+https://github.com/ryan112358/mbi.git",
]
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/google-parfait/dpsynth"
repository = "https://github.com/google-parfait/dpsynth"
changelog = "https://github.com/google-parfait/dpsynth/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pipeline = [
    "apache-beam>=2.75.0",
    "google-crc32c",
    "pipeline-dp",
    "tensorflow",
]
all = [
    "dpsynth[pipeline,text]",
]
dev = [
    "chex",
    "pytest",
    "pytest-xdist",
    "pyrefly",
]
text = [
    "flax",
    "google-tunix",
    "qwix",
    "google-genai>=2.0",
    "jax-privacy @ git+https://github.com/google-parfait/jax_privacy.git",
    "optax",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
]
examples = [
    "dpsynth[text]",
    "datasets",
    "kagglehub",
    "scikit-learn",
    "sdmetrics",
]

[tool.setuptools.dynamic]
version = {attr = "dpsynth.__version__"}

[tool.setuptools.packages.find]
namespaces = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
filterwarnings = [
    "ignore:.*JAX is running in float32 mode.*:UserWarning",
    "ignore:.*JAX persistent compilation cache is enabled.*:UserWarning",
]

[tool.pyrefly]
project-includes = [
  "**/*.py",
]
preset = "basic"


[tool.uv]
override-dependencies = [
    "typing-extensions>=4.14.0",
    "tokenizers>=0.20.0",
]
